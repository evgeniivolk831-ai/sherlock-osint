name: Sync official Sherlock catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official catalog and license
        run: |
          mkdir -p upstream/sherlock
          curl -fL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock_project/resources/data.json -o upstream/sherlock/data.json
          curl -fL https://raw.githubusercontent.com/sherlock-project/sherlock/master/LICENSE -o upstream/sherlock/LICENSE
          curl -fL https://raw.githubusercontent.com/sherlock-project/sherlock/master/README.md -o upstream/sherlock/README-upstream.md
          python -m json.tool upstream/sherlock/data.json >/dev/null
      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/sherlock
          if git diff --cached --quiet; then
            echo "Upstream catalog is already current."
          else
            git commit -m "Sync official Sherlock catalog"
            git push
          fi
